- id: nfl-prob-2pt-float64
  finding: C-M7
  file: sportsdataverse/nfl/nfl_pbp.py
  snippet: 'scored_pl = pl.from_pandas(scored).with_columns(pl.col("go_index").cast(pl.UInt32))'
  mutant: 'scored_pl = pl.from_pandas(scored).with_columns(pl.col("go_index").cast(pl.UInt32), pl.col("prob_2pt").cast(pl.Float64))'
  test: tests/nfl/test_nfl_schema_allowlist.py::test_prob_2pt_has_one_documented_dtype
  expected: kill
  note: >-
    The 2.17 fix as a mutant: prob_2pt Float64 whether or not the two-point model scores turns
    the C-M7 strict xfail (Float32 on 400791508, Float64 on 221013007) into XPASS. Needs the
    download-on-demand nfl4th WP booster, which the test loads explicitly: without it the test
    skips by name and the mutant survives. 2.17 drops the marker and rewrites this row (the
    snippet then carries the cast).

